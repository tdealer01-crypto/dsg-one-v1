name: DSG Full Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Typecheck + Lint + DSG checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Typecheck
        run: npm run dsg:typecheck

      - name: Lint
        run: npm run lint

      - name: Ising MCP regression tests
        run: npx vitest run tests/dsg/mcp-ising-route.test.ts tests/dsg/nvidia-ising.test.ts

      - name: Owner Auth0 approval regression tests
        run: npx vitest run tests/dsg/approval-client-stepup.test.ts tests/dsg/approval-middleware-callback.test.ts tests/dsg/auth0-approver-mfa-readonly-route.test.ts tests/dsg/user-bound-auth0-spacetime-bridge.test.ts

      - name: DSG operator navigation regression tests
        run: npx vitest run tests/dsg/sidebar-touch-navigation.test.ts tests/dsg/operator-chat-first.test.ts

      - name: Chat history and real model regression tests
        run: npx vitest run tests/dsg/chat-history-model.test.ts tests/dsg/chat-history-recovery-route.test.ts

      - name: Cinema Free Auth0 signed-member proof negative controls
        run: npx vitest run tests/dsg/cinema-free-link-proof.test.ts tests/dsg/cinema-controller-contract.test.ts

      - name: Claim gate
        run: npm run dsg:claim-gate

      - name: Runtime check
        run: npm run dsg:runtime-check

      - name: Product ready
        env:
          DSG_ONE_V1_SUPABASE_URL: ${{ secrets.DSG_ONE_V1_SUPABASE_URL }}
          DSG_ONE_V1_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DSG_ONE_V1_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DSG_ONE_V1_SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run dsg:product-ready
        continue-on-error: true

      - name: Production flow + smoke tests
        env:
          APP_URL: ${{ secrets.DSG_ONE_V1_PRODUCTION_URL }}
          DSG_ONE_V1_PRODUCTION_URL: ${{ secrets.DSG_ONE_V1_PRODUCTION_URL }}
        run: |
          npm run dsg:production-flow-check || true
          npm run smoke:marketplace-readiness || true
          npm run smoke:security-rbac || true
          npm run smoke:entitlement || true
