name: Verify DSG ONE Key Vault RBAC

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/azure-bootstrap-dsg-one-keyvault.sh'
      - '.github/workflows/verify-dsg-one-keyvault-rbac.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/azure-bootstrap-dsg-one-keyvault.sh'
      - '.github/workflows/verify-dsg-one-keyvault-rbac.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      AZURE_CLIENT_ID: bd54ab6e-5f92-48c8-8f8d-0c114ef938da
      AZURE_TENANT_ID: cbc618d5-9aa3-46b5-ae64-d07794603a7a
      AZURE_SUBSCRIPTION_ID: dcf13c0d-0d9f-4f81-aa89-c6b50aaef839
      RESOURCE_GROUP: rg-t.dealer01-0468
      VAULT_NAME: dsg-shared-secrets
      WEBAPP_NAME: dsg-one-v1
      OIDC_OBJECT_ID: 4de7b2bd-2cf2-4f9f-a290-1c3b448f483e
      SETTING_NAME: DSG_ONE_V1_SUPABASE_SERVICE_ROLE_KEY
      SECRET_NAME: dsg-one-v1-supabase-service-role-key
      SUPABASE_PROJECT_URL: https://zeyguilldygozufpgxms.supabase.co
      APP_URL: https://dsg-one-v1.azurewebsites.net

    steps:
      - uses: actions/checkout@v4

      - name: Azure login with production OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Capture safe Key Vault binding evidence
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/keyvault
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"

          VAULT_ID=$(az keyvault show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$VAULT_NAME" \
            --query id --output tsv)
          WEBAPP_PRINCIPAL=$(az webapp identity show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME" \
            --query principalId --output tsv)

          oidc_role=$(az role assignment list \
            --assignee-object-id "$OIDC_OBJECT_ID" \
            --scope "$VAULT_ID" \
            --query "[?roleDefinitionName=='Key Vault Secrets Officer'] | length(@)" \
            --output tsv 2>/dev/null || echo 0)
          app_role=$(az role assignment list \
            --assignee-object-id "$WEBAPP_PRINCIPAL" \
            --scope "$VAULT_ID" \
            --query "[?roleDefinitionName=='Key Vault Secrets User'] | length(@)" \
            --output tsv 2>/dev/null || echo 0)
          reference=$(az webapp config appsettings list \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME" \
            --query "[?name=='$SETTING_NAME'].value | [0]" \
            --output tsv)

          reference_bound=false
          if [[ "$reference" == @Microsoft.KeyVault\(* ]]; then
            reference_bound=true
          fi

          raw_server_key=$(az keyvault secret show \
            --vault-name "$VAULT_NAME" \
            --name "$SECRET_NAME" \
            --query value --output tsv 2>/dev/null || true)
          server_key=$(printf '%s' "$raw_server_key" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          if [[ ${#server_key} -ge 2 && "${server_key:0:1}" == '"' && "${server_key: -1}" == '"' ]]; then server_key="${server_key:1:${#server_key}-2}"; fi
          if [[ "$server_key" =~ (sb_secret_[A-Za-z0-9_-]+) ]]; then server_key="${BASH_REMATCH[1]}"; fi
          key_present=false
          key_kind=missing
          vault_root_http=000
          vault_automation_http=000

          if [[ -n "$server_key" ]]; then
            echo "::add-mask::$server_key"
            key_present=true
            if [[ "$server_key" == sb_secret_* ]]; then
              key_kind=secret_api_key
              auth_headers=(-H "apikey: $server_key")
            elif [[ "$server_key" == eyJ* ]]; then
              key_kind=legacy_service_role_jwt
              auth_headers=(-H "apikey: $server_key" -H "Authorization: Bearer $server_key")
            else
              key_kind=unknown
              auth_headers=(-H "apikey: $server_key")
            fi

            vault_root_http=$(curl --silent --show-error \
              --user-agent 'DSG-One-KeyVault-Probe/1.0' \
              --output /dev/null --write-out '%{http_code}' \
              "${auth_headers[@]}" \
              "$SUPABASE_PROJECT_URL/rest/v1/" || true)
            vault_automation_http=$(curl --silent --show-error \
              --user-agent 'DSG-One-KeyVault-Probe/1.0' \
              --output /dev/null --write-out '%{http_code}' \
              "${auth_headers[@]}" \
              "$SUPABASE_PROJECT_URL/rest/v1/dsg_automation_runs?select=id&limit=1" || true)
          fi

          key_valid=false
          if [[ "$vault_root_http" =~ ^2 && "$vault_automation_http" =~ ^2 ]]; then
            key_valid=true
          fi
          echo "key_valid=$key_valid" >> "$GITHUB_OUTPUT"

          runtime_code=$(curl --silent --show-error \
            --output evidence/keyvault/agent-status.json \
            --write-out '%{http_code}' \
            "$APP_URL/api/agent/status" || true)

          jq -n \
            --arg source_sha "$GITHUB_SHA" \
            --argjson oidc_role "$([[ "$oidc_role" != '0' ]] && echo true || echo false)" \
            --argjson app_role "$([[ "$app_role" != '0' ]] && echo true || echo false)" \
            --argjson reference_bound "$reference_bound" \
            --argjson key_present "$key_present" \
            --arg key_kind "$key_kind" \
            --arg vault_root_http "$vault_root_http" \
            --arg vault_automation_http "$vault_automation_http" \
            --argjson key_valid "$key_valid" \
            --arg runtime_http "$runtime_code" \
            '{
              source_sha: $source_sha,
              github_oidc_key_vault_secrets_officer: $oidc_role,
              webapp_key_vault_secrets_user: $app_role,
              service_role_setting_is_key_vault_reference: $reference_bound,
              key_vault_secret_present: $key_present,
              key_vault_secret_kind: $key_kind,
              key_vault_supabase_root_http: $vault_root_http,
              key_vault_automation_table_http: $vault_automation_http,
              key_vault_secret_valid: $key_valid,
              production_agent_status_http: $runtime_http,
              secret_values_exposed: false
            }' > evidence/keyvault/rbac-proof.json

          if [[ "$oidc_role" != '0' && "$app_role" != '0' && "$reference_bound" == 'true' && "$runtime_code" == '200' ]]; then
            state=PASS
          else
            state=BLOCKED
          fi

          {
            echo "## DSG ONE Key Vault RBAC — $state"
            echo
            echo "- GitHub OIDC → Key Vault Secrets Officer: $([[ "$oidc_role" != '0' ]] && echo PASS || echo MISSING)"
            echo "- Web App identity → Key Vault Secrets User: $([[ "$app_role" != '0' ]] && echo PASS || echo MISSING)"
            echo "- $SETTING_NAME uses Key Vault reference: $([[ "$reference_bound" == 'true' ]] && echo PASS || echo MISSING)"
            echo "- Key Vault secret present: $([[ "$key_present" == 'true' ]] && echo PASS || echo MISSING)"
            echo "- Key type: $key_kind"
            echo "- Key Vault secret → Supabase REST root HTTP: $vault_root_http"
            echo "- Key Vault secret → dsg_automation_runs HTTP: $vault_automation_http"
            echo "- Key Vault secret valid for canonical Supabase project: $([[ "$key_valid" == 'true' ]] && echo PASS || echo BLOCKED)"
            echo "- /api/agent/status HTTP: $runtime_code"
            echo '- Secret values printed: NO'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh App Service Key Vault references
        if: github.event_name != 'pull_request' && steps.probe.outputs.key_valid == 'true'
        shell: bash
        run: |
          set -euo pipefail
          resource_id="/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.Web/sites/$WEBAPP_NAME"
          az rest \
            --method post \
            --uri "https://management.azure.com${resource_id}/config/configreferences/appsettings/refresh?api-version=2022-03-01" \
            --output none
          az webapp restart --resource-group "$RESOURCE_GROUP" --name "$WEBAPP_NAME"

          runtime_code=000
          for attempt in $(seq 1 24); do
            runtime_code=$(curl --silent --show-error \
              --output evidence/keyvault/agent-status-after-refresh.json \
              --write-out '%{http_code}' \
              "$APP_URL/api/agent/status" || true)
            [[ "$runtime_code" == '200' ]] && break
            sleep 5
          done

          jq -n \
            --arg runtime_http "$runtime_code" \
            --arg source_sha "$GITHUB_SHA" \
            '{source_sha: $source_sha, key_vault_reference_refresh: true, production_agent_status_http: $runtime_http, secret_values_exposed: false}' \
            > evidence/keyvault/refresh-proof.json

          {
            echo
            echo "## DSG ONE Key Vault refresh"
            echo "- Reference refresh: EXECUTED"
            echo "- Web App restart: EXECUTED"
            echo "- /api/agent/status after refresh HTTP: $runtime_code"
            echo '- Secret values printed: NO'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload safe RBAC evidence
        uses: actions/upload-artifact@v4
        with:
          name: dsg-one-keyvault-rbac-${{ github.run_id }}
          path: evidence/keyvault
          if-no-files-found: error
          retention-days: 30
