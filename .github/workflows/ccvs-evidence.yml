name: ccvs-evidence

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  unit-evidence:
    name: Emit CCVS unit evidence envelope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      # Correctness gate: any unit-test failure blocks the workflow.
      # Coverage percentage is intentionally NOT used as a proxy for runtime
      # correctness because the denominator grows as new production files are
      # added, even when all existing tests continue to pass.
      - name: Run unit tests (hard gate)
        run: npx vitest run

      # Evidence gate: collect the repository-wide coverage report even when the
      # legacy global percentage thresholds are below target. Vitest exits 1 on
      # those thresholds, so this step is advisory; the next step still requires
      # a real coverage-summary.json to exist.
      - name: Collect global coverage evidence (advisory)
        id: coverage
        continue-on-error: true
        run: npm run test:coverage

      - name: Require coverage evidence artifact
        run: |
          if [ ! -s coverage/coverage-summary.json ]; then
            echo "ERROR: coverage/coverage-summary.json was not produced."
            exit 1
          fi
          echo "Coverage evidence exists. Global percentage is recorded as quality debt, not functional failure."

      - name: Publish CCVS gate summary
        run: |
          node - <<'JSEOF' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
          const t = summary.total;
          console.log('## CCVS unit gate');
          console.log('');
          console.log('- **Unit tests:** PASS — hard correctness gate');
          console.log('- **Coverage evidence:** PRESENT');
          console.log('- **Global coverage policy:** ADVISORY — does not block solely because repository size increased');
          console.log(`- Lines: ${t.lines.pct}%`);
          console.log(`- Branches: ${t.branches.pct}%`);
          console.log(`- Functions: ${t.functions.pct}%`);
          console.log(`- Statements: ${t.statements.pct}%`);
          console.log('');
          console.log('A missing coverage artifact still fails this job. Test failures still fail this job.');
          JSEOF

      - name: Emit evidence envelope
        id: emit
        run: |
          node - <<'JSEOF'
          const fs = require('fs');
          const crypto = require('crypto');

          let coverage = {};
          try {
            const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
            const t = summary.total;
            coverage = {
              lines: t.lines.pct,
              branches: t.branches.pct,
              functions: t.functions.pct,
              statements: t.statements.pct
            };
          } catch (e) {
            console.error('coverage-summary.json missing or unreadable:', e.message);
            process.exit(1);
          }

          const envelope = {
            schema_version: '1.0.0',
            evidence_type: 'unit',
            subject: [{
              name: 'repo:' + process.env.GITHUB_REPOSITORY,
              digest: { sha1: process.env.GITHUB_SHA }
            }],
            run: {
              repo: process.env.GITHUB_REPOSITORY,
              commit: process.env.GITHUB_SHA,
              ref: process.env.GITHUB_REF,
              workflow_run_id: process.env.GITHUB_RUN_ID,
              builder_id: 'https://github.com/actions/runner',
              invocation_id: process.env.GITHUB_RUN_ID + '-' + (process.env.GITHUB_RUN_ATTEMPT || '1')
            },
            oidc: {
              issuer: 'https://token.actions.githubusercontent.com',
              audience: 'ccvs-evidence',
              sub: 'repo:' + process.env.GITHUB_REPOSITORY + ':ref:' + process.env.GITHUB_REF,
              repository: process.env.GITHUB_REPOSITORY,
              ref: process.env.GITHUB_REF
            },
            metrics: {
              tests: {
                status: 'PASS',
                gate: 'hard'
              },
              coverage,
              coverage_policy: {
                mode: 'advisory_global',
                gate: 'evidence_required',
                rationale: 'Repository-wide percentage may decrease when new production files expand the denominator; functional correctness is gated by test results, while coverage remains auditable quality debt.'
              }
            },
            integrity: {
              previous_chain_hash: '',
              chain_hash: ''
            },
            policy_version: 'v2-test-correctness-separation',
            generated_at: new Date().toISOString()
          };

          const raw = JSON.stringify(envelope, null, 2);
          const digest = crypto.createHash('sha256').update(raw).digest('hex');
          envelope.integrity.chain_hash = 'sha256:' + digest;

          const out = JSON.stringify(envelope, null, 2);
          fs.writeFileSync('ccvs-unit-evidence.json', out);
          console.log('Evidence chain_hash: sha256:' + digest);
          console.log('Coverage:', JSON.stringify(coverage));
          console.log('Coverage policy: advisory_global; evidence_required');
          JSEOF

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccvs-unit-evidence-${{ github.run_id }}
          path: ccvs-unit-evidence.json
          retention-days: 90
          if-no-files-found: error
