name: Agentic Improvement Runtime CI

on:
  push:
    branches: [feat/governed-improvement-runtime]
    paths:
      - 'lib/dsg/app-builder/improvement-runtime.ts'
      - 'tests/dsg/improvement-runtime.test.ts'
      - '.github/workflows/agentic-improvement-runtime-ci.yml'
  pull_request:
    paths:
      - 'lib/dsg/app-builder/improvement-runtime.ts'
      - 'tests/dsg/improvement-runtime.test.ts'
      - '.github/workflows/agentic-improvement-runtime-ci.yml'

permissions:
  contents: read

jobs:
  governed-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Targeted runtime tests
        run: npx vitest run tests/dsg/improvement-runtime.test.ts
      - name: DSG typecheck
        run: npm run dsg:typecheck
      - name: Lint
        run: npm run lint
