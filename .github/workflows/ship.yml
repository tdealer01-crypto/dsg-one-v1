name: Ship

# One governed production handoff on an already-running EC2 host.
# The immutable image build remains the security/scan gate; Ship verifies it
# and performs no EC2 start, capacity creation, billing change or IAM mutation.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: Reason for shipping the current main
        required: false
        default: operator-approved release
  workflow_run:
    workflows: ["Build DSG ONE V1 production image on AWS"]
    types: [completed]

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: dsg-one-v1-production-ship
  cancel-in-progress: false

jobs:
  ship:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AWS_REGION: us-east-1
      AWS_ROLE_ARN: arn:aws:iam::121205961822:role/dsg-one-v1-github-deploy
      INSTANCE_ID: i-01a2ee90890a558c3
      REGISTRY: 121205961822.dkr.ecr.us-east-1.amazonaws.com
      REPO: dsg-one-v1-prod
      DSG_PRODUCTION_URL: https://dsg.pics
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Verify source and post-merge CI
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'BLOCK=INVALID_SHA'; exit 20; }
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA" || { echo 'BLOCK=SOURCE_MISMATCH'; exit 21; }
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$MAIN_SHA" = "$RELEASE_SHA" || { echo 'BLOCK=SUPERSEDED_SOURCE'; echo 'nextAction=Release latest main only'; exit 22; }
          # An image build finishing first must not skip parallel CI on the same main SHA.
          for attempt in $(seq 1 40); do
            RUNS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=main&per_page=100")"
            if jq -e --arg sha "$RELEASE_SHA" '
              [.workflow_runs[] | select(.head_sha == $sha)] as $runs |
              ["DSG Verify","DSG Full Test Suite","DSG App Builder CI","ccvs-evidence",
               "Build DSG ONE V1 production image on AWS"] |
              all(. as $name | any($runs[]; .name == $name and .status == "completed" and .conclusion == "success"))
            ' <<< "$RUNS" >/dev/null; then
              echo "RELEASE_SOURCE_AND_CI=PASS sha=$RELEASE_SHA"
              exit 0
            fi
            if (( attempt == 40 )); then
              echo 'BLOCK=EXACT_MAIN_CI_INCOMPLETE'
              echo 'nextAction=Inspect the five workflows for this exact SHA; do not deploy an unverified image'
              exit 23
            fi
            sleep 15
          done

      - name: Assume existing least-privilege AWS deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify immutable source, scan and already-running EC2
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          SSM_SHA="$(aws ssm get-parameter --name /dsg/one/prod/image-source-sha --query Parameter.Value --output text)"
          SSM_DIGEST="$(aws ssm get-parameter --name /dsg/one/prod/image-digest --query Parameter.Value --output text)"
          [[ "$SSM_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo 'BLOCK=INVALID_SSM_DIGEST'; exit 24; }
          test "$SSM_SHA" = "$RELEASE_SHA" || { echo 'BLOCK=IMAGE_SOURCE_STALE'; echo 'nextAction=Build exact current main image'; exit 25; }
          ECR_DIGEST="$(aws ecr describe-images --repository-name "$REPO" --image-ids imageTag="$RELEASE_SHA" --query 'imageDetails[0].imageDigest' --output text)"
          test "$ECR_DIGEST" = "$SSM_DIGEST" || { echo 'BLOCK=IMAGE_DIGEST_MISMATCH'; exit 26; }
          SCAN="$(aws ecr describe-image-scan-findings --repository-name "$REPO" --image-id imageDigest="$ECR_DIGEST" --output json)"
          jq -e '.imageScanStatus.status=="COMPLETE" and ((.imageScanFindings.findingSeverityCounts.CRITICAL//0)==0)' <<< "$SCAN" >/dev/null ||
            { echo 'BLOCK=IMAGE_SECURITY_SCAN'; exit 27; }
          STATE="$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" --query 'Reservations[0].Instances[0].State.Name' --output text)"
          test "$STATE" = running ||
            { echo "BLOCK=EC2_NOT_RUNNING state=$STATE"; echo 'nextAction=No automatic start or paid resource creation'; exit 28; }
          echo "digest=$ECR_DIGEST" >> "$GITHUB_OUTPUT"
          echo "RELEASE_PREFLIGHT=PASS source=$RELEASE_SHA digest=$ECR_DIGEST host=existing-running"

      - name: Promote only DSG ONE on the existing host with rollback
        shell: bash
        env:
          RELEASE_DIGEST: ${{ steps.preflight.outputs.digest }}
        run: |
          set -euo pipefail
          # Idempotent recovery: do not recreate a healthy, already-bound release.
          if curl -fsS --max-time 10 "$DSG_PRODUCTION_URL/api/agent/status" | jq -e --arg sha "$RELEASE_SHA" '.ok==true and .version==$sha and .sourceBound==true and .digestBound==true' >/dev/null; then
            echo "DSG_ONE_RELEASE=ALREADY_DEPLOYED_VERIFIED sha=$RELEASE_SHA"
            exit 0
          fi
          # Send only bounded, non-secret code/identities. Host keeps its
          # existing runtime credentials, Compose service and project.
          cat > /tmp/dsg-one-release.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          SHA="$1"
          DIGEST="$2"
          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]] || exit 41
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 42
          NAME=aws-dsg-one-v1-1
          SERVICE=dsg-one-v1
          REGISTRY=121205961822.dkr.ecr.us-east-1.amazonaws.com
          TARGET="$REGISTRY/dsg-one-v1-prod@$DIGEST"
          test "$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.service" }}' "$NAME")" = "$SERVICE"
          FILES="$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project.config_files" }}' "$NAME")"
          PROJECT="$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$NAME")"
          IFS=',' read -r BASE IGNORE <<< "$FILES"
          [[ "$BASE" == /opt/dsg/operator/rollouts/*/candidate.json ]] ||
            { echo 'BLOCK=UNSUPPORTED_COMPOSE_FILE'; exit 43; }
          [[ "$PROJECT" =~ ^[a-zA-Z0-9_-]+$ ]] || exit 44
          test -f "$BASE"
          jq -e --arg svc "$SERVICE" '.services[$svc].image | type=="string"' "$BASE" >/dev/null
          PREVIOUS="$(docker inspect -f '{{.Config.Image}}' "$NAME")"
          [[ "$PREVIOUS" == "$REGISTRY/dsg-one-v1-prod"* ]] ||
            { echo 'BLOCK=UNEXPECTED_PREVIOUS_IMAGE'; exit 45; }
          DIR="$(dirname "$BASE")"
          OVERLAY="$DIR/ship-$SHA.override.json"
          ROLLBACK="$DIR/ship-$SHA.rollback.json"
          jq -n --arg image "$TARGET" '{services:{"dsg-one-v1":{image:$image}}}' > "$OVERLAY"
          jq -n --arg image "$PREVIOUS" '{services:{"dsg-one-v1":{image:$image}}}' > "$ROLLBACK"
          chmod 600 "$OVERLAY" "$ROLLBACK"
          changed=0
          rollback() {
            if [[ "$changed" == 1 ]]; then
              echo "RELEASE=ROLLBACK_ATTEMPTED"
              docker compose -p "$PROJECT" -f "$BASE" -f "$ROLLBACK" up -d --no-deps --force-recreate "$SERVICE" || true
            fi
          }
          trap rollback ERR
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin "$REGISTRY" >/dev/null
          docker pull "$TARGET" >/dev/null
          changed=1
          docker compose -p "$PROJECT" -f "$BASE" -f "$OVERLAY" up -d --no-deps --force-recreate "$SERVICE"
          ok=0
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:8080/api/agent/status |
                 jq -e --arg sha "$SHA" '.ok==true and .version==$sha and .sourceBound==true and .digestBound==true' >/dev/null; then
              ok=1
              break
            fi
            sleep 2
          done
          if [[ "$ok" != 1 ]]; then
            echo 'BLOCK=POST_DEPLOY_LOCAL_HEALTH'
            false
          fi
          changed=0
          echo "DSG_ONE_ON_HOST_RELEASE=PASS sha=$SHA digest=$DIGEST"
          SCRIPT
          CODE="$(base64 -w0 /tmp/dsg-one-release.sh)"
          jq -n --arg code "$CODE" --arg sha "$RELEASE_SHA" --arg digest "$RELEASE_DIGEST" \
            '{commands:[("printf %s " + $code + " | base64 -d | bash -s -- " + $sha + " " + $digest)]}' > /tmp/ssm.json
          ID="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --parameters file:///tmp/ssm.json --timeout-seconds 600 \
            --comment 'DSG ONE exact-main guarded release on existing EC2' --query 'Command.CommandId' --output text)"
          for attempt in $(seq 1 90); do
            STATE="$(aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$STATE" in
              Success|Failed|TimedOut|Cancelled) break ;;
            esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE_ID" --output json > /tmp/ship-invocation.json
          jq -r '.StandardOutputContent // ""' /tmp/ship-invocation.json
          jq -r '.StandardErrorContent // ""' /tmp/ship-invocation.json >&2
          if [[ "$STATE" != Success ]] || ! jq -e --arg sha "$RELEASE_SHA" \
            '.StandardOutputContent | contains("DSG_ONE_ON_HOST_RELEASE=PASS sha="+$sha)' /tmp/ship-invocation.json >/dev/null; then
            echo "BLOCK=PROVIDER_RELEASE_FAILED ssm_command_id=$ID"
            echo 'nextAction=Inspect bounded SSM invocation and on-host rollback, then retry from the failed boundary'
            exit 59
          fi
          echo "DSG_ONE_RELEASE=DEPLOYED command_id=$ID"

      - name: Independently verify public serving SHA
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 10 "$DSG_PRODUCTION_URL/api/agent/status" |
               jq -e --arg sha "$RELEASE_SHA" '.ok==true and .version==$sha and .sourceBound==true and .digestBound==true' >/dev/null; then
              echo "DSG_ONE_PUBLIC_SERVING=VERIFIED_COMPLETED sha=$RELEASE_SHA"
              exit 0
            fi
            sleep 5
          done
          echo 'BLOCK=PUBLIC_SERVING_SHA_MISMATCH'
          echo 'nextAction=Inspect external HTTPS serving and revert only if live provider readback proves a regression'
          exit 60

      - name: Show release result
        if: always()
        shell: bash
        run: |
          echo "## DSG ONE production release" >> "$GITHUB_STEP_SUMMARY"
          echo "Source SHA: $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Existing EC2 only; no new cloud resources were started." >> "$GITHUB_STEP_SUMMARY"
          echo "Status: Deduced from exact steps above; PASS only if all release and public serving checks passed." >> "$GITHUB_STEP_SUMMARY"
          echo "See failed step for BLOCK, nextAction and SSM command ID." >> "$GITHUB_STEP_SUMMARY"
