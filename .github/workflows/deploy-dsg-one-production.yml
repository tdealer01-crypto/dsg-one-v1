name: Deploy DSG ONE Production Azure

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact dsg-one-v1 commit SHA to build and deploy
        required: true
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-dsg-one-production.yml'
      - 'Dockerfile'
      - 'app/api/agent/status/route.ts'

permissions:
  contents: read
  id-token: write

concurrency:
  group: dsg-one-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build exact SHA, deploy, and prove runtime identity
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}
      AZURE_CLIENT_ID: bd54ab6e-5f92-48c8-8f8d-0c114ef938da
      AZURE_TENANT_ID: cbc618d5-9aa3-46b5-ae64-d07794603a7a
      AZURE_SUBSCRIPTION_ID: dcf13c0d-0d9f-4f81-aa89-c6b50aaef839
      RESOURCE_GROUP: rg-t.dealer01-0468
      WEBAPP_NAME: dsg-one-v1
      ACR_NAME: dsgcp50aaef839
      IMAGE_NAME: dsg-one-v1
      APP_URL: https://dsg-one-v1.azurewebsites.net

    steps:
      - name: Validate exact source authority
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'BLOCK: source_sha must be a full 40-character commit SHA.' >&2
            exit 1
          }

      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Require source SHA on main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main || {
            echo 'BLOCK: requested source SHA is not reachable from main.' >&2
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Pre-deploy hard gates
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run dsg:typecheck
          npx vitest run tests/dsg/agent-status.test.ts tests/dsg/activecampaign-lifecycle.test.ts

      - name: Azure login with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Build locked image in ACR
        id: image
        shell: bash
        run: |
          set -euo pipefail
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"

          CURRENT_FX=$(az webapp config show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME" \
            --query linuxFxVersion --output tsv)
          CURRENT_IMAGE="${CURRENT_FX#DOCKER|}"
          test -n "$CURRENT_IMAGE"
          echo "previous_image=$CURRENT_IMAGE" >> "$GITHUB_OUTPUT"

          SETTINGS=$(az webapp config appsettings list \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME" \
            --output json --only-show-errors)

          PREVIOUS_SOURCE_SHA=$(SETTINGS="$SETTINGS" node --input-type=module <<'NODE'
          const rows = JSON.parse(process.env.SETTINGS);
          process.stdout.write(rows.find((x) => x.name === 'DSG_DEPLOYED_SOURCE_SHA')?.value ?? '');
          NODE
          )
          PREVIOUS_IMAGE_DIGEST=$(SETTINGS="$SETTINGS" node --input-type=module <<'NODE'
          const rows = JSON.parse(process.env.SETTINGS);
          process.stdout.write(rows.find((x) => x.name === 'DSG_DEPLOYED_IMAGE_DIGEST')?.value ?? '');
          NODE
          )
          echo "previous_source_sha=$PREVIOUS_SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "previous_image_digest=$PREVIOUS_IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

          PUBLIC_URL=$(SETTINGS="$SETTINGS" node --input-type=module <<'NODE'
          const rows = JSON.parse(process.env.SETTINGS);
          process.stdout.write(rows.find((x) => x.name === 'NEXT_PUBLIC_DSG_ONE_V1_SUPABASE_URL')?.value ?? '');
          NODE
          )
          PUBLIC_KEY=$(SETTINGS="$SETTINGS" node --input-type=module <<'NODE'
          const rows = JSON.parse(process.env.SETTINGS);
          process.stdout.write(rows.find((x) => x.name === 'NEXT_PUBLIC_DSG_ONE_V1_SUPABASE_PUBLISHABLE_KEY')?.value ?? '');
          NODE
          )
          test -n "$PUBLIC_URL" && test -n "$PUBLIC_KEY" || {
            echo 'BLOCK: required public Supabase build settings are absent.' >&2
            exit 1
          }
          echo "::add-mask::$PUBLIC_URL"
          echo "::add-mask::$PUBLIC_KEY"

          SHORT_SHA="${SOURCE_SHA:0:12}"
          IMAGE_TAG="prod-${SHORT_SHA}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          IMAGE_REF="$ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG"

          az acr build \
            --registry "$ACR_NAME" \
            --image "$IMAGE_NAME:$IMAGE_TAG" \
            --file Dockerfile \
            --build-arg "DSG_BUILD_SOURCE_SHA=$SOURCE_SHA" \
            --build-arg "NEXT_PUBLIC_DSG_ONE_V1_SUPABASE_URL=$PUBLIC_URL" \
            --build-arg "NEXT_PUBLIC_DSG_ONE_V1_SUPABASE_PUBLISHABLE_KEY=$PUBLIC_KEY" \
            .

          IMAGE_DIGEST=$(az acr repository show \
            --name "$ACR_NAME" \
            --image "$IMAGE_NAME:$IMAGE_TAG" \
            --query digest --output tsv)
          test -n "$IMAGE_DIGEST"

          # The run-specific tag is never reused. Lock it after push so its
          # digest cannot be replaced by a later build.
          az acr repository update \
            --name "$ACR_NAME" \
            --image "$IMAGE_NAME:$IMAGE_TAG" \
            --write-enabled false \
            --output none

          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          echo "digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Deploy through App Service Managed Identity
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          APP_ID=$(az webapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME" \
            --query id --output tsv)
          PRINCIPAL_ID=$(az webapp identity show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME" \
            --query principalId --output tsv)
          ACR_ID=$(az acr show --name "$ACR_NAME" --query id --output tsv)
          test -n "$APP_ID" && test -n "$PRINCIPAL_ID" && test -n "$ACR_ID"

          HAS_PULL=$(az role assignment list \
            --assignee-object-id "$PRINCIPAL_ID" \
            --scope "$ACR_ID" \
            --query "[?roleDefinitionName=='AcrPull'] | length(@)" \
            --output tsv)
          if [[ "$HAS_PULL" == "0" ]]; then
            az role assignment create \
              --assignee-object-id "$PRINCIPAL_ID" \
              --assignee-principal-type ServicePrincipal \
              --role AcrPull \
              --scope "$ACR_ID" \
              --output none
          fi

          az resource update \
            --ids "$APP_ID/config/web" \
            --set properties.acrUseManagedIdentityCreds=true \
            --output none

          az webapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME" \
            --settings \
              WEBSITES_PORT=8080 \
              PORT=8080 \
              "DSG_DEPLOYED_SOURCE_SHA=$SOURCE_SHA" \
              "DSG_DEPLOYED_IMAGE_DIGEST=${{ steps.image.outputs.digest }}" \
            --output none

          az webapp config container set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME" \
            --docker-custom-image-name "${{ steps.image.outputs.ref }}" \
            --docker-registry-server-url "https://$ACR_NAME.azurecr.io" \
            --output none
          az webapp restart --resource-group "$RESOURCE_GROUP" --name "$WEBAPP_NAME"
          echo 'started=true' >> "$GITHUB_OUTPUT"

      - name: Prove runtime identity, fail-closed control, and lifecycle delivery
        id: proof
        shell: bash
        run: |
          set -euo pipefail
          rollback() {
            if [[ "${{ steps.deploy.outputs.started }}" == "true" ]]; then
              echo 'Readiness failed; restoring previous image and deployment identity.' >&2
              PREVIOUS_SOURCE_SHA="${{ steps.image.outputs.previous_source_sha }}"
              PREVIOUS_IMAGE_DIGEST="${{ steps.image.outputs.previous_image_digest }}"
              RESTORE_SETTINGS=()
              DELETE_SETTINGS=()
              if [[ -n "$PREVIOUS_SOURCE_SHA" ]]; then
                RESTORE_SETTINGS+=("DSG_DEPLOYED_SOURCE_SHA=$PREVIOUS_SOURCE_SHA")
              else
                DELETE_SETTINGS+=(DSG_DEPLOYED_SOURCE_SHA)
              fi
              if [[ -n "$PREVIOUS_IMAGE_DIGEST" ]]; then
                RESTORE_SETTINGS+=("DSG_DEPLOYED_IMAGE_DIGEST=$PREVIOUS_IMAGE_DIGEST")
              else
                DELETE_SETTINGS+=(DSG_DEPLOYED_IMAGE_DIGEST)
              fi
              if (( ${#RESTORE_SETTINGS[@]} > 0 )); then
                az webapp config appsettings set \
                  --resource-group "$RESOURCE_GROUP" \
                  --name "$WEBAPP_NAME" \
                  --settings "${RESTORE_SETTINGS[@]}" \
                  --output none || true
              fi
              if (( ${#DELETE_SETTINGS[@]} > 0 )); then
                az webapp config appsettings delete \
                  --resource-group "$RESOURCE_GROUP" \
                  --name "$WEBAPP_NAME" \
                  --setting-names "${DELETE_SETTINGS[@]}" \
                  --output none || true
              fi
              az webapp config container set \
                --resource-group "$RESOURCE_GROUP" \
                --name "$WEBAPP_NAME" \
                --docker-custom-image-name "${{ steps.image.outputs.previous_image }}" \
                --docker-registry-server-url "https://$ACR_NAME.azurecr.io" \
                --output none || true
              az webapp restart --resource-group "$RESOURCE_GROUP" --name "$WEBAPP_NAME" || true
            fi
          }
          rollback_on_signal() {
            rollback
            exit 1
          }
          trap rollback ERR
          trap rollback_on_signal TERM INT

          # Leave a bounded rollback window inside the job timeout. The status
          # endpoint must be served by the new image and prove real DB access.
          DEADLINE=$((SECONDS + 720))
          while true; do
            VERIFY_HTTP=$(curl --silent --show-error --max-time 10 \
              --dump-header "$RUNNER_TEMP/verify.headers" \
              --output "$RUNNER_TEMP/verify.html" \
              --write-out '%{http_code}' "$APP_URL/dsg/verify" || true)
            VERIFY_LOCATION=$(awk 'tolower($1) == "location:" {print $2}' \
              "$RUNNER_TEMP/verify.headers" | tr -d '\r' | tail -n 1)
            LOGIN_HTTP=000
            STATUS_HTTP=000

            if [[ "$VERIFY_HTTP" == "307" ]] \
              && [[ "$VERIFY_LOCATION" == "/login?next=%2Fdsg%2Fverify" ]]; then
              LOGIN_HTTP=$(curl --silent --show-error --max-time 10 \
                --output "$RUNNER_TEMP/login.html" \
                --write-out '%{http_code}' "$APP_URL/login" || true)
              STATUS_HTTP=$(curl --silent --show-error --max-time 10 \
                --output "$RUNNER_TEMP/status.json" \
                --write-out '%{http_code}' "$APP_URL/api/agent/status" || true)
            fi

            if [[ "$LOGIN_HTTP" == "200" ]] && [[ "$STATUS_HTTP" == "200" ]] \
              && jq -e \
                --arg sha "$SOURCE_SHA" \
                --arg digest "${{ steps.image.outputs.digest }}" '
                  .ok == true and
                  .version == $sha and
                  .deployment.buildSourceSha == $sha and
                  .deployment.expectedSourceSha == $sha and
                  .deployment.imageDigest == $digest and
                  .deployment.sourceBound == true and
                  .deployment.digestBound == true and
                  .checks.db == true and
                  .readiness.deploymentIdentityOk == true
                ' "$RUNNER_TEMP/status.json" >/dev/null; then
              break
            fi

            if (( SECONDS >= DEADLINE )); then
              echo "BLOCK: runtime identity/readiness was not proven; verify_http=$VERIFY_HTTP location=$VERIFY_LOCATION login_http=$LOGIN_HTTP status_http=$STATUS_HTTP" >&2
              false
            fi
            sleep 5
          done

          START_HTTP=$(curl --silent --show-error --max-time 20 \
            --output "$RUNNER_TEMP/started.json" \
            --write-out '%{http_code}' \
            --request POST "$APP_URL/api/dsg/lifecycle/event" \
            --header 'Content-Type: application/json' \
            --data '{"event":"verification_started","email":"t.dealer01@dsg.pics","data":{"surface":"production_first_value_canary"}}')
          test "$START_HTTP" = "200"
          jq -e '
            .ok == true and
            .delivery.ok == true and
            (.delivery.delivered == true or .delivery.reason == "ALREADY_DELIVERED")
          ' "$RUNNER_TEMP/started.json" >/dev/null

          PROOF_HTTP=$(curl --silent --show-error --max-time 30 \
            --output "$RUNNER_TEMP/proof.json" \
            --write-out '%{http_code}' \
            --request POST "$APP_URL/api/dsg/app-builder/proof" \
            --header 'Content-Type: application/json' \
            --data '{"goal":"Verify one production AI action through the governed DSG First Value canary.","email":"t.dealer01@dsg.pics"}')
          test "$PROOF_HTTP" = "200"
          jq -e '
            .ok == true and
            .status == "PASS" and
            .proofKind == "APP_BUILDER_FLOW_FAIL_CLOSED_PROOF" and
            (.proofHash | type == "string" and length == 64) and
            .runtimeGate.status == "BLOCKED" and
            .assertions.runtimeGateBlocksWithoutExecutor == true and
            .assertions.runtimeDidNotStart == true and
            .claimBoundary.claimStatus == "APP_BUILDER_FLOW_PROOF_FAIL_CLOSED" and
            .claimBoundary.productionReadyClaim == false and
            .lifecycle.ok == true and
            (.lifecycle.delivered == true or .lifecycle.reason == "ALREADY_DELIVERED")
          ' "$RUNNER_TEMP/proof.json" >/dev/null

          PROOF_HASH=$(jq -r '.proofHash' "$RUNNER_TEMP/proof.json")
          VIEW_HTTP=$(jq -n \
            --arg email 't.dealer01@dsg.pics' \
            --arg hash "$PROOF_HASH" \
            '{event:"proof_viewed",email:$email,data:{proof_hash:$hash,surface:"production_first_value_canary"}}' |
            curl --silent --show-error --max-time 20 \
              --output "$RUNNER_TEMP/viewed.json" \
              --write-out '%{http_code}' \
              --request POST "$APP_URL/api/dsg/lifecycle/event" \
              --header 'Content-Type: application/json' \
              --data @-)
          test "$VIEW_HTTP" = "200"
          jq -e '
            .ok == true and
            .delivery.ok == true and
            (.delivery.delivered == true or .delivery.reason == "ALREADY_DELIVERED")
          ' "$RUNNER_TEMP/viewed.json" >/dev/null

          LIVE_FX=$(az webapp config show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME" \
            --query linuxFxVersion --output tsv)
          test "${LIVE_FX#DOCKER|}" = "${{ steps.image.outputs.ref }}"

          LIVE_DIGEST=$(az acr repository show \
            --name "$ACR_NAME" \
            --image "$IMAGE_NAME:${{ steps.image.outputs.tag }}" \
            --query digest --output tsv)
          WRITE_ENABLED=$(az acr repository show \
            --name "$ACR_NAME" \
            --image "$IMAGE_NAME:${{ steps.image.outputs.tag }}" \
            --query changeableAttributes.writeEnabled --output tsv)
          test "$LIVE_DIGEST" = "${{ steps.image.outputs.digest }}"
          test "$WRITE_ENABLED" = "false"

          RUNTIME_GATE=$(jq -r '.runtimeGate.status' "$RUNNER_TEMP/proof.json")
          CLAIM_STATUS=$(jq -r '.claimBoundary.claimStatus' "$RUNNER_TEMP/proof.json")

          jq -n \
            --arg observed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg repository "${{ github.repository }}" \
            --arg source_sha "$SOURCE_SHA" \
            --arg workflow_sha "${{ github.sha }}" \
            --arg app "$WEBAPP_NAME" \
            --arg url "$APP_URL" \
            --arg image "${{ steps.image.outputs.ref }}" \
            --arg digest "${{ steps.image.outputs.digest }}" \
            --arg verify_location "$VERIFY_LOCATION" \
            --argjson verify_http "$VERIFY_HTTP" \
            --argjson login_http "$LOGIN_HTTP" \
            --argjson status_http "$STATUS_HTTP" \
            --argjson lifecycle_started_http "$START_HTTP" \
            --argjson proof_http "$PROOF_HTTP" \
            --argjson proof_viewed_http "$VIEW_HTTP" \
            --slurpfile status "$RUNNER_TEMP/status.json" \
            --slurpfile proof "$RUNNER_TEMP/proof.json" \
            --slurpfile started "$RUNNER_TEMP/started.json" \
            --slurpfile viewed "$RUNNER_TEMP/viewed.json" '
            {
              observed_at:$observed_at,
              repository:$repository,
              source_sha:$source_sha,
              workflow_sha:$workflow_sha,
              azure:{app:$app,url:$url,image:$image,digest:$digest,tag_locked:true},
              probes:{
                verify_page_http:$verify_http,
                verify_redirect_location:$verify_location,
                login_page_http:$login_http,
                agent_status_http:$status_http,
                lifecycle_started_http:$lifecycle_started_http,
                proof_http:$proof_http,
                proof_viewed_http:$proof_viewed_http
              },
              deployment_identity:$status[0].deployment,
              readiness:{db:$status[0].checks.db,deployment_identity:$status[0].readiness.deploymentIdentityOk},
              negative_control:{
                status:"PASS",
                proof_hash:$proof[0].proofHash,
                proof_kind:$proof[0].proofKind,
                runtime_gate:$proof[0].runtimeGate.status,
                claim_status:$proof[0].claimBoundary.claimStatus,
                runtime_did_not_start:$proof[0].assertions.runtimeDidNotStart
              },
              first_value_delivery:{
                lifecycle_satisfied:true,
                verification_started:$started[0].delivery,
                proof_created:$proof[0].lifecycle,
                proof_viewed:$viewed[0].delivery
              },
              truth_boundary:{
                health_200_alone_is_not_e2e:true,
                negative_control_is_not_positive_runtime_execution:true,
                governed_candidate_chain_verified:false,
                production_ready_claim:false
              }
            }' > production-evidence.json

          echo 'lifecycle_satisfied=true' >> "$GITHUB_OUTPUT"
          echo "runtime_gate=$RUNTIME_GATE" >> "$GITHUB_OUTPUT"
          echo "claim_status=$CLAIM_STATUS" >> "$GITHUB_OUTPUT"
          trap - ERR TERM INT

      - name: Upload immutable deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: dsg-one-production-evidence-${{ env.SOURCE_SHA }}
          path: production-evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Deployment truth summary
        shell: bash
        run: |
          {
            echo '## DSG ONE Azure deployment truth'
            echo
            printf -- '- source SHA: `%s`\n' "$SOURCE_SHA"
            printf -- '- image: `%s`\n' "${{ steps.image.outputs.ref }}"
            printf -- '- digest: `%s`\n' "${{ steps.image.outputs.digest }}"
            echo '- exact runtime identity + DB readiness: `PASS`'
            printf -- '- fail-closed negative control: `PASS` (`%s`, `%s`)\n' \
              "${{ steps.proof.outputs.runtime_gate }}" \
              "${{ steps.proof.outputs.claim_status }}"
            printf -- '- ActiveCampaign lifecycle satisfied: `%s`\n' \
              "${{ steps.proof.outputs.lifecycle_satisfied }}"
            echo '- governed candidate/Cinema/Control Plane/Monitoring chain: `NOT_EVALUATED`'
            echo '- productionReadyClaim: `false`'
          } >> "$GITHUB_STEP_SUMMARY"
